name: Capture project visuals

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/assets/projects/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live project landing pages
        run: node scripts/capture-project-visuals.mjs

      - name: Commit project visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/projects
          if git diff --cached --quiet; then
            echo "No project visual changes."
            exit 0
          fi
          git commit -m "chore: update project landing page visuals"
          git push
